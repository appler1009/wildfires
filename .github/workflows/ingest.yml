name: Daily data ingestion

on:
  schedule:
    # 12:00 UTC ≈ 8am Eastern / 5am Pacific during daylight time (7am/4am in
    # winter) - adjust to taste, GitHub Actions cron is always UTC.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run ingest

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: scheduled ingestion refresh $(date -u +%Y-%m-%d)"
          git push
